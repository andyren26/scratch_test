<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>積木程式測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* 版面仿 Scratch 編輯器：藍色選單列 + 題目分頁；左邊題目卡，右邊積木區（分類 + 積木盤 + 程式區）；窄螢幕改上下排列 */
  :root {
    --bg:#e9eef8; --card:#ffffff; --ink:#575e75; --strong:#3d4254; --line:#d9e0ec;
    --scratch:#4c97ff; --on-scratch:#ffffff; --tab:#d9e3f2; --code:#f2f5fb;
    --ok:#0fbd8c; --ok-ink:#ffffff; --bad:#e0435b;
    --font-body:"Helvetica Neue",Helvetica,Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#161b27; --card:#222838; --ink:#c3c9db; --strong:#eef1f8; --line:#363e55;
    --scratch:#4c97ff; --on-scratch:#ffffff; --tab:#2b3247; --code:#2a3044;
    --ok:#2fd3a3; --ok-ink:#0d1a16; --bad:#ff7b8e; color-scheme:dark; } }
  :root[data-theme="dark"] {
    --bg:#161b27; --card:#222838; --ink:#c3c9db; --strong:#eef1f8; --line:#363e55;
    --scratch:#4c97ff; --on-scratch:#ffffff; --tab:#2b3247; --code:#2a3044;
    --ok:#2fd3a3; --ok-ink:#0d1a16; --bad:#ff7b8e; color-scheme:dark; }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font-family:var(--font-body); font-size:15px; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  .gutter { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  header { display:flex; align-items:center; gap:12px; padding-block:8px; background:var(--scratch); color:var(--on-scratch); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 auto 0 0; letter-spacing:.02em; }
  header label { display:flex; align-items:center; gap:6px; }
  header input { border-color:transparent; background:var(--on-scratch); color:#3d4254; }
  header input.missing { outline:3px solid #ffd54a; }
  header button { background:transparent; color:var(--on-scratch); border-color:rgba(255,255,255,.55); }
  header button.primary { background:var(--ok); border-color:var(--ok); color:var(--ok-ink); }
  .headMsg { flex-basis:100%; margin:0; padding:6px 10px; border-radius:6px; background:#fff4cc; color:#6b4e00; font-size:14px; }
  input, textarea { font:inherit; color:var(--strong); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:6px 12px; background:var(--card); color:var(--strong); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--scratch); outline-offset:2px; }
  button.primary { background:var(--ok); border-color:var(--ok); color:var(--ok-ink); font-weight:700; }
  button.accent { background:var(--scratch); border-color:var(--scratch); color:var(--on-scratch); font-weight:700; }
  #tabs { display:flex; gap:4px; padding-block:10px 0; overflow-x:auto; }
  #tabs button { border-radius:8px 8px 0 0; border:none; background:var(--tab); white-space:nowrap; color:var(--ink); }
  #tabs button.active { background:var(--card); font-weight:700; color:var(--strong); }
  #tabs .score { font-size:12px; margin-left:6px; font-variant-numeric:tabular-nums; }
  main { flex:1; display:flex; min-height:0; padding-block:0 16px; gap:12px; }
  #blocklyDiv { flex:1; min-width:0; min-height:420px; border-radius:0 8px 8px 8px; overflow:hidden; border:1px solid var(--line); }
  #side { width:clamp(320px, 34vw, 480px); min-width:0; display:flex; flex-direction:column; gap:10px; overflow:auto; }

  /* 畫筆題的目標圖形（題目的一部分，不是可執行的舞台） */
  #target { display:block; width:100%; max-width:320px; aspect-ratio:4/3; border:1px solid var(--line); border-radius:6px; background:#fff; }

  /* 題目卡 */
  #card { min-width:0; display:flex; flex-direction:column; gap:10px; background:var(--card); padding:14px; border-radius:8px; }
  #card h2 { margin:0; font-size:18px; color:var(--strong); text-wrap:balance; }
  #desc { white-space:pre-wrap; line-height:1.7; color:var(--strong); }
  #empty { display:flex; flex-direction:column; gap:8px; line-height:1.7; color:var(--strong); }
  #empty h2 { margin:0; }
  .label { font-size:12px; letter-spacing:.08em; margin-bottom:4px; }
  pre { background:var(--code); color:var(--strong); padding:8px; border-radius:6px; margin:0; white-space:pre-wrap; font-family:var(--font-mono); font-size:13px; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; color:var(--strong); }
  td, th { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  .pass { color:var(--ok); font-weight:700; } .fail { color:var(--bad); font-weight:700; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .note { font-size:13px; line-height:1.6; margin:0; }
  .msg { font-size:14px; min-height:1.4em; margin:8px 0 0; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  dialog { border:1px solid var(--line); border-radius:10px; width:min(600px, 92vw); max-height:90vh; background:var(--card); color:var(--strong); }
  dialog::backdrop { background:rgba(10,14,25,.45); }
  dialog h3 { margin-top:0; }
  dialog .row { margin-top:12px; }
  #askDlg { width:min(380px, 92vw); }
  #askDlg input { width:100%; }

  /* Scratch 風格的分類列：彩色圓點 + 下方文字 */
  .blocklyToolboxDiv { width:64px; padding:2px 0 !important; border-right:1px solid #d9d9d9; }
  .blocklyToolboxDiv .blocklyTreeRow { display:flex; justify-content:center; height:auto !important; line-height:1.2; padding:5px 0 !important; margin:0 !important; border-radius:0; }
  .blocklyToolboxDiv .blocklyTreeRowContentContainer { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .blocklyToolboxDiv .blocklyTreeRow:hover { background:#f0f4fc; }
  .blocklyToolboxDiv .blocklyTreeRow.scratchSelected { background:#e9f1fc !important; }
  .scratchCatDot { width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,.15); }
  .blocklyToolboxDiv .blocklyTreeLabel { font-family:var(--font-body); font-size:11px; color:#575e75; }
  .blocklyToolboxDiv .scratchSelected .blocklyTreeLabel { color:#4c97ff; }
  @media (max-width: 900px) { main { flex-direction:column; } #side { width:auto; overflow:visible; } #blocklyDiv { min-height:62vh; } body { height:auto; } }
</style>

<script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/msg/zh-hant.js"></script>
</head>
<body>
<header class="gutter">
  <h1>積木程式測驗</h1>
  <label for="studentClass">班級 <input id="studentClass" placeholder="例：701" size="5"></label>
  <label for="studentSeat">座號 <input id="studentSeat" inputmode="numeric" placeholder="例：12" size="3"></label>
  <label for="studentName">姓名 <input id="studentName" placeholder="請輸入姓名" size="8"></label>
  <button id="btnSubmitAll" class="primary">交卷</button>
  <button id="btnAnswerCode" hidden>產生答案碼</button>
  <p id="headMsg" class="headMsg" hidden></p>
</header>
<div id="tabs" class="gutter"></div>
<main class="gutter">
  <aside id="side">
    <section id="card">
      <div id="empty"><h2>題庫載入中…</h2></div>
      <div id="qPanel" hidden style="display:contents">
        <h2 id="qTitle"></h2>
        <div id="desc"></div>
        <div><div class="label">範例</div><pre id="example"></pre></div>
        <canvas id="target" width="480" height="360" hidden aria-label="目標圖形"></canvas>
        <div class="row">
          <button class="accent" id="btnRun">檢查範例</button>
          <button class="primary" id="btnCheck">✔ 提交本題</button>
        </div>
        <div id="result" class="tablewrap"></div>
        <p id="shotMsg" class="msg" hidden></p>
      </div>
    </section>
  </aside>
  <div id="blocklyDiv"></div>
</main>

<dialog id="reportDlg">
  <h3>成績單</h3>
  <div id="report" class="tablewrap"></div>
  <p id="rSend" class="msg"></p>
  <p id="rShot" class="msg"></p>
  <label for="rCsv" class="note" style="display:block;margin-top:10px">CSV（可貼到 Excel）
    <textarea id="rCsv" rows="2" readonly style="width:100%;font-family:var(--font-mono);font-size:12px"></textarea></label>
  <div class="row"><button id="rCopy">複製成績</button><button id="rClose" style="margin-left:auto">關閉</button></div>
  <p id="rMsg" class="msg ok"></p>
</dialog>

<!-- 老師工具：網址後面加上 #teacher 才會出現 -->
<dialog id="codeDlg">
  <h3>答案碼</h3>
  <p class="note">把程式區的參考答案轉成答案碼，貼到試算表「題庫」的「答案碼」欄。系統會用它算出每筆測資的標準答案。也可以把答案碼貼回來，載入到程式區修改。</p>
  <textarea id="codeText" rows="6" style="width:100%;margin-top:8px;font-family:var(--font-mono);font-size:12px" aria-label="答案碼"></textarea>
  <div class="row">
    <button class="primary" id="codeCopy">複製</button>
    <button id="codeLoad">載入到程式區</button>
    <button id="codeClose" style="margin-left:auto">關閉</button>
  </div>
  <p id="codeMsg" class="msg"></p>
</dialog>

<!-- 取代瀏覽器的 prompt/confirm（建立變數、清單、積木時使用） -->
<dialog id="askDlg">
  <p id="askMsg"></p>
  <input id="askInput">
  <div class="row" style="justify-content:flex-end"><button id="askCancel">取消</button><button class="accent" id="askOk">確定</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);

// ===== 1. 設定：貼上 Google Apps Script 部署後的「網頁應用程式」網址 =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGnLP4KYgutJN-Cy_C8KMLy19pRNvWHuEge0wlUozrGLbIEYGi81kaBa4AChKI0gYbfg/exec";  // 例如 "https://script.google.com/macros/s/AKfy.../exec"

// 題庫從試算表「題庫」工作表讀取。每題 = 說明 + 輸入值（依序給「詢問並等待」）+ 測資 + 配分 + 評分方式 + 答案碼
let questions = [];
let current = 0;
let loadedId = null; // 目前工作區裡是哪一題（以題目名稱當 id）
const saved = {};    // 每題的積木狀態
const scores = {};   // 每題得分
let bankState = "loading"; // loading | ready | nourl | error
let bankProblems = [];     // 試算表裡格式有問題的題目
const MODES = ["說出", "畫筆", "角色位置", "音符"];

// ===== 2. Scratch 外觀：顏色、字型、圖示 =====
const svgUri = (svg) => "data:image/svg+xml," + encodeURIComponent(svg);
const FLAG = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.5 3v18" stroke="#45993d" stroke-width="2" stroke-linecap="round"/><path d="M6.5 4.5c3-2 6 2 9 0s3.5-1 3.5-1v9s-.5-1-3.5 1-6-2-9 0z" fill="#4cbf56" stroke="#45993d" stroke-width="1.2" stroke-linejoin="round"/></svg>`);
const LOOP = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 6v5a4 4 0 0 1-4 4H8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M11 11l-4 4 4 4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
const TURN_CCW = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 15a7 7 0 1 1 7 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M3 11l3 5 4-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
const TURN_CW = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 15a7 7 0 1 0-7 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M21 11l-3 5-4-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
const PEN_ICON = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 20l2-6L16 4l4 4-10 10z" fill="#fff" stroke="#0b8e69" stroke-width="1.4" stroke-linejoin="round"/><path d="M4 20l2-6 4 4z" fill="#0b8e69"/></svg>`);
const NOTE_ICON = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="#fff" stroke-width="2"/><circle cx="6.5" cy="18" r="3" fill="#fff"/><circle cx="17.5" cy="16" r="3" fill="#fff"/></svg>`);

const style = (p, s, t, extra) => Object.assign({ colourPrimary:p, colourSecondary:s, colourTertiary:t }, extra);
const scratchTheme = Blockly.Theme.defineTheme("scratch", {
  base: Blockly.Themes.Classic,
  blockStyles: {
    motion_blocks:    style("#4C97FF", "#4280D7", "#3373CC"),
    looks_blocks:     style("#9966FF", "#855CD6", "#774DCB"),
    sound_blocks:     style("#CF63CF", "#C94FC9", "#BD42BD"),
    event_blocks:     style("#FFBF00", "#E6AC00", "#CC9900", { hat:"cap" }),
    control_blocks:   style("#FFAB19", "#EC9C13", "#CF8B17"),
    control_hat:      style("#FFAB19", "#EC9C13", "#CF8B17", { hat:"cap" }),
    sensing_blocks:   style("#5CB1D6", "#47A8D1", "#2E8EB8"),
    operator_blocks:  style("#59C059", "#46B946", "#389438"),
    math_blocks:      style("#59C059", "#46B946", "#389438"),
    text_blocks:      style("#59C059", "#46B946", "#389438"),
    variable_blocks:  style("#FF8C1A", "#FF8000", "#DB6E00"),
    list_blocks:      style("#FF661A", "#FF5500", "#E64D00"),
    procedure_blocks: style("#FF6680", "#FF4D6A", "#FF3355", { hat:"cap" }),
    pen_blocks:       style("#0FBD8C", "#0DA57A", "#0B8E69"),
    music_blocks:     style("#0FBD8C", "#0DA57A", "#0B8E69"),
  },
  componentStyles: {
    workspaceBackgroundColour:"#F9F9F9", toolboxBackgroundColour:"#FFFFFF", toolboxForegroundColour:"#575E75",
    flyoutBackgroundColour:"#F9F9F9", flyoutForegroundColour:"#575E75", flyoutOpacity:1,
    scrollbarColour:"#CECDCE", insertionMarkerColour:"#000000", insertionMarkerOpacity:0.2,
  },
  fontStyle: { family:'"Helvetica Neue", Helvetica, Arial, "Noto Sans TC", sans-serif', weight:"500", size:12 },
});

// 變數與「我的積木」沿用 Blockly 內建積木，改成 Scratch 的說法
Object.assign(Blockly.Msg, {
  NEW_VARIABLE:"建立一個變數", NEW_VARIABLE_TITLE:"新的變數名稱：",
  VARIABLES_SET:"變數 %1 設為 %2", MATH_CHANGE_TITLE:"變數 %1 改變 %2",
  PROCEDURES_DEFNORETURN_TITLE:"定義", PROCEDURES_DEFNORETURN_PROCEDURE:"積木名稱",
  PROCEDURES_BEFORE_PARAMS:"參數：", PROCEDURES_CALL_BEFORE_PARAMS:"參數：",
  PROCEDURES_MUTATORCONTAINER_TITLE:"參數", PROCEDURES_MUTATORARG_TITLE:"參數名稱：",
  PROCEDURES_DEFNORETURN_TOOLTIP:"定義自己的積木", PROCEDURES_DEFNORETURN_COMMENT:"",
  PROCEDURES_CALLNORETURN_TOOLTIP:"執行自己定義的積木",
});

// ===== 3. 積木定義（分類、文字、形狀照 Scratch 3 繁體中文版） =====
const COSTUME_NAMES = ["機器人1", "機器人2", "箭頭", "球"];
const BACKDROP_NAMES = ["空白", "座標格線", "迷宮"];
const SOUND_NAMES = ["喵", "啵", "嗶", "鼓聲"];
const KEY_OPTS = [["空白","space"],["向上","up"],["向下","down"],["向右","right"],["向左","left"],["任何","any"],
  ..."abcdefghijklmnopqrstuvwxyz0123456789".split("").map(c => [c, c])];
const INSTRUMENTS = ["(1) 鋼琴", "(2) 電子琴", "(3) 風琴", "(4) 吉他", "(5) 長笛", "(6) 木琴"];
const DRUMS = ["(1) 小鼓", "(2) 大鼓", "(3) 鈸", "(4) 拍手"];

// 廣播訊息的下拉選單：列出目前用到的訊息，最後一項可以新增
const extraMsgs = new Set(["訊息1"]);
function msgOptions() {
  const set = new Set(extraMsgs);
  try { ws.getAllBlocks(false).forEach(b => { const f = b.getField("BROADCAST_OPTION"); if (f && f.getValue() !== "__new__") set.add(f.getValue()); }); } catch (e) {}
  return [...set].filter(Boolean).sort().map(m => [m, m]).concat([["新的訊息", "__new__"]]);
}
function collectMsgs(state) {
  JSON.stringify(state || {}, (k, v) => { if (v && typeof v === "object" && typeof v.BROADCAST_OPTION === "string") extraMsgs.add(v.BROADCAST_OPTION); return v; });
}
Blockly.Extensions.register("broadcast_menu", function () {
  this.getField("BROADCAST_OPTION").setValidator(function (v) {
    if (v !== "__new__") return v;
    blocklyDialog("prompt", "新的訊息名稱：", "", (name) => { name = (name || "").trim(); if (name) { extraMsgs.add(name); this.setValue(name); } });
    return null;
  });
});

const IN = (name, check) => check ? { type:"input_value", name, check } : { type:"input_value", name };
const DD = (name, opts) => ({ type:"field_dropdown", name, options: typeof opts === "function" ? opts : opts.map(o => Array.isArray(o) ? o : [o, o]) });
const IMG = (src) => ({ type:"field_image", src, width:24, height:24, alt:"*" });
const VAR = (name) => ({ type:"field_variable", name, variable:"我的變數" });
const LIST = (name) => ({ type:"field_variable", name, variable:"清單", variableTypes:["list"], defaultType:"list" });
const stmt = (type, message0, args0, st, extra) => Object.assign({ type, message0, args0, previousStatement:null, nextStatement:null, style:st, inputsInline:true }, extra);
const rep = (type, message0, args0, st, output) => ({ type, message0, args0, output: output === undefined ? null : output, style:st, inputsInline:true });
const hat = (type, message0, args0, st, extra) => Object.assign({ type, message0, args0, nextStatement:null, style:st }, extra);
const cblock = (type, message0, args0, extra) => Object.assign({ type, message0, args0,
  message1:"%1", args1:[{ type:"input_statement", name:"SUBSTACK" }], previousStatement:null, nextStatement:null, style:"control_blocks" }, extra);

Blockly.defineBlocksWithJsonArray([
  { type:"scratch_text", message0:"%1", args0:[{ type:"field_input", name:"TEXT", text:"" }], output:null, style:"text_blocks" },

  // 動作
  stmt("motion_movesteps", "移動 %1 點", [IN("STEPS")], "motion_blocks"),
  stmt("motion_turnright", "右轉 %1 %2 度", [IMG(TURN_CW), IN("DEGREES")], "motion_blocks"),
  stmt("motion_turnleft", "左轉 %1 %2 度", [IMG(TURN_CCW), IN("DEGREES")], "motion_blocks"),
  stmt("motion_goto", "定位到 %1", [DD("TO", [["隨機位置","random"],["鼠標","mouse"]])], "motion_blocks"),
  stmt("motion_gotoxy", "定位到 x: %1 y: %2", [IN("X"), IN("Y")], "motion_blocks"),
  stmt("motion_glideto", "滑行 %1 秒到 %2", [IN("SECS"), DD("TO", [["隨機位置","random"],["鼠標","mouse"]])], "motion_blocks"),
  stmt("motion_glidesecstoxy", "滑行 %1 秒到 x: %2 y: %3", [IN("SECS"), IN("X"), IN("Y")], "motion_blocks"),
  stmt("motion_pointindirection", "面朝 %1 度", [IN("DIRECTION")], "motion_blocks"),
  stmt("motion_pointtowards", "面朝 %1 向", [DD("TOWARDS", [["鼠標","mouse"]])], "motion_blocks"),
  stmt("motion_changexby", "x 改變 %1", [IN("DX")], "motion_blocks"),
  stmt("motion_setx", "x 設為 %1", [IN("X")], "motion_blocks"),
  stmt("motion_changeyby", "y 改變 %1", [IN("DY")], "motion_blocks"),
  stmt("motion_sety", "y 設為 %1", [IN("Y")], "motion_blocks"),
  stmt("motion_ifonedgebounce", "碰到邊緣就反彈", [], "motion_blocks"),
  stmt("motion_setrotationstyle", "迴轉方式設為 %1", [DD("STYLE", [["左-右","left-right"],["不旋轉","don't rotate"],["任意旋轉","all around"]])], "motion_blocks"),
  rep("motion_xposition", "x 座標", [], "motion_blocks", "Number"),
  rep("motion_yposition", "y 座標", [], "motion_blocks", "Number"),

// ===== 4. 積木轉成程式碼 =====
// 每個程式（帽子積木下面那一串）變成一個 generator 函式，迴圈尾端和「等待」會暫停，模擬 Scratch 一格一格的執行，
// 也讓好幾個程式、分身可以同時執行，跟 Scratch 一樣。
const gen = (window.javascript && javascript.javascriptGenerator) || Blockly.JavaScript;
const def = (type, fn) => { if (gen.forBlock) gen.forBlock[type] = fn; else gen[type] = fn; };
const NT = Blockly.Names.NameType;
const val = (b, name, dflt = "0") => gen.valueToCode(b, name, 99) || dflt;
const sval = (b, name) => val(b, name, "''");
const fld = (b, name) => JSON.stringify(b.getFieldValue(name));
const sub = (b, name) => gen.statementToCode(b, name);
const YIELD = "  if (A.yc()) yield 0;\n";
const procName = (name) => "P_" + gen.nameDB_.getName(name, NT.PROCEDURE);

// 「我的積木」的參數是區域變數（遞迴才會正確）；其他變數存在 A.vars
function localParam(b, id) {
  const v = b.workspace.getVariableById(id);
  const root = b.getRootBlock();
  if (!v || root.type !== "procedures_defnoreturn") return null;
  const i = root.getVars().indexOf(v.name);
  return i >= 0 ? "a" + i : null;
}
const varRef = (b, id) => localParam(b, id) || `V[${JSON.stringify(id)}]`;

const G = {
  scratch_text: (b) => [JSON.stringify(b.getFieldValue("TEXT")), 0],

  motion_movesteps: (b) => `A.move(T, ${val(b, "STEPS")});\n`,

  motion_goto: (b) => `A.goTo(T, ${fld(b, "TO")});\n`,

  g.translate(240 + s.x, 180 - s.y);
  if (s.rot === "all around") g.rotate((s.dir - 90) * Math.PI / 180);

    if (s.effects.color) f.push(`hue-rotate(${(s.effects.color * 1.8) % 360}deg)`);
    if (s.effects.brightness) f.push(`brightness(${1 + s.effects.brightness / 100})`);

  }
  g.drawImage(c.canvas, -c.cx, -c.cy, c.w, c.h);

function blocklyDialog(mode, msg, dflt, cb) {
  const dlg = $("askDlg"), inp = $("askInput");
  $("askMsg").textContent = msg;
  inp.hidden = mode !== "prompt"; inp.value = dflt || "";
  $("askCancel").hidden = mode === "alert";
  let finished = false;
  const done = (ok) => {
    if (finished) return; finished = true;
    dlg.close();
    if (mode === "prompt") cb(ok ? inp.value : null); else if (mode === "confirm") cb(ok); else if (cb) cb();
  };
  $("askOk").onclick = () => done(true);
  $("askCancel").onclick = () => done(false);
  inp.onkeydown = (e) => { if (e.key === "Enter") done(true); };
  dlg.oncancel = () => done(false);
  dlg.showModal();
  if (mode === "prompt") inp.focus();
}

function starterState() {

    blocks:{ languageVersion:0, blocks:[{ type:"event_whenflagclicked", x:40, y:40 }] } };

function loadInto(w, state) { collectMsgs(state); w.clear(); Blockly.serialization.workspaces.load(state, w); }

// ===== 9. 評分：在背景模擬執行，比對說出的內容／畫出的圖形／角色位置／演奏的音符 =====
const headlessWs = new Blockly.Workspace();
function runHeadless(state, inputs) {
  const vm = new VM({ headless:true, inputs:inputs.slice() });
  try {
    loadInto(headlessWs, state);
    const prog = compile(headlessWs);
    if (!prog.hasFlag) return { error:"請把程式接在「當綠旗被點擊」下面" };
    vm.load(prog);
    vm.greenFlag();
    let f = 0;
    for (; f < MAX_FRAMES && vm.threads.length && !vm.error; f++) { vm.now = f / FPS; vm.frame(); }
    vm.timedOut = vm.threads.length > 0;
  } catch (e) { vm.error = e.message; }
  const s = vm.original;
  return { error:vm.error, out:vm.out, pen:vm.penSegs, notes:vm.notes, pos:{ x:vm.lim(s.x), y:vm.lim(s.y), dir:vm.lim(s.dir) }, timedOut:vm.timedOut };
}
const inputsOf = (q, t) => q.inputs.map(k => t.in[k]);

// 答案碼：老師的參考程式（JSON 轉 base64）
function encodeAnswer(state) {
  const bytes = new TextEncoder().encode(JSON.stringify(state));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return "SB1:" + btoa(bin);
}
function decodeAnswer(code) {
  code = String(code || "").trim();
  if (!code.startsWith("SB1:")) throw new Error("答案碼格式不對");
  const bin = atob(code.slice(4)), bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

// 每筆測資的標準答案：試算表有寫就用寫的，沒寫就執行答案碼算出來
const expectCache = {};
function expectedFor(q, i) {
  const key = q.id + "#" + i;
  if (expectCache[key]) return expectCache[key];
  const t = q.tests[i];
  let e;
  if (t.expect != null && String(t.expect).trim() !== "") e = parseExpect(q.mode, String(t.expect));
  else if (q.answer) {
    try {
      const r = runHeadless(decodeAnswer(q.answer), inputsOf(q, t));
      e = r.error ? { error:"參考答案執行錯誤：" + r.error } : { out:r.out, pen:r.pen, pos:r.pos, notes:r.notes };
    } catch (err) { e = { error:"答案碼無法讀取：" + err.message }; }
  } else e = { error:"這筆測資沒有標準答案，請老師補上" };
  return expectCache[key] = e;
}
function parseExpect(mode, s) {
  if (mode === "角色位置") {
    const get = (re) => { const m = s.match(re); return m ? Number(m[1]) : undefined; };
    return { pos:{ x:get(/x\s*[=:：]\s*(-?[\d.]+)/i), y:get(/y\s*[=:：]\s*(-?[\d.]+)/i), dir:get(/方向\s*[=:：]\s*(-?[\d.]+)/) } };
  }
  if (mode === "音符") return { notes: s.split(/[,，\s]+/).filter(Boolean).map(p => { const [n, b] = p.split(/[:：]/); return { note:Number(n), beats: b === undefined ? undefined : Number(b) }; }) };
  return { out: s.split("|").map(x => x.trim()) };
}

function rasterize(segs, width) {
  const c = mkCanvas(480, 360), g = c.getContext("2d");
  g.lineCap = "round"; g.lineWidth = width; g.strokeStyle = "#000";
  g.beginPath();
  for (const [x1, y1, x2, y2] of segs) { g.moveTo(240 + x1, 180 - y1); g.lineTo(240 + x2 + (x1 === x2 && y1 === y2 ? 0.01 : 0), 180 - y2); }
  g.stroke();
  return g.getImageData(0, 0, 480, 360).data;
}
function penMatch(ref, stu) {
  const rThin = rasterize(ref, 3), rFat = rasterize(ref, 9), sThin = rasterize(stu, 3), sFat = rasterize(stu, 9);
  let rc = 0, rh = 0, sc = 0, sx = 0;
  for (let i = 3; i < rThin.length; i += 4) {
    if (rThin[i]) { rc++; if (sFat[i]) rh++; }
    if (sThin[i]) { sc++; if (!rFat[i]) sx++; }
  }
  return { cover: rc ? rh / rc : (sc ? 0 : 1), extra: sc ? sx / sc : 0 };
}
const dirDiff = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
const fmtPos = (p) => ["x", "y", "dir"].filter(k => p[k] !== undefined).map(k => `${k === "dir" ? "方向" : k}=${Math.round(p[k] * 100) / 100}`).join(", ");
const fmtNotes = (ns) => ns.length ? ns.slice(0, 24).map(n => n.beats === undefined ? n.note : `${n.note}(${n.beats}拍)`).join(" ") + (ns.length > 24 ? " …" : "") : "（沒有演奏）";
const normalize = (lines) => lines.map(s => String(s).trim()).join("\n").trim();

function compare(mode, exp, got) {
  if (mode === "畫筆") {
    const m = penMatch(exp.pen, got.pen);
    return { pass: m.cover >= 0.97 && m.extra <= 0.03, exp:"題目的目標圖形", got:`畫出目標的 ${Math.round(m.cover * 100)}%，多畫了 ${Math.round(m.extra * 100)}%` };
  }
  if (mode === "角色位置") {
    const p = exp.pos, g = got.pos;
    const pass = (p.x === undefined || Math.abs(p.x - g.x) <= 1) && (p.y === undefined || Math.abs(p.y - g.y) <= 1) && (p.dir === undefined || dirDiff(p.dir, g.dir) <= 1);
    return { pass, exp:fmtPos(p), got:fmtPos({ x:g.x, y:g.y, dir:g.dir }) };
  }
  if (mode === "音符") {
    const e = exp.notes, g = got.notes;
    const pass = e.length === g.length && e.every((n, i) => Math.abs(n.note - g[i].note) < 0.01 && (n.beats === undefined || Math.abs(n.beats - g[i].beats) < 0.001));
    return { pass, exp:fmtNotes(e), got:fmtNotes(e.some(n => n.beats !== undefined) ? g : g.map(n => ({ note:n.note }))) };
  }
  return { pass: normalize(got.out) === normalize(exp.out), exp:exp.out.join("\n"), got:got.out.join("\n") || "（什麼都沒說）" };
}

function gradeCurrent(onlyExample) {
  const q = questions[current];
  const state = Blockly.serialization.workspaces.save(ws);
  const idxs = onlyExample ? [0] : q.tests.map((_, i) => i);
  const rows = idxs.map(i => {
    const t = q.tests[i], exp = expectedFor(q, i);
    if (exp.error) return { i, t, pass:false, err:exp.error, hidden:false };
    const got = runHeadless(state, inputsOf(q, t));
    if (got.error) return { i, t, pass:false, err:got.error, hidden: !onlyExample && i > 0 };
    const c = compare(q.mode, exp, got);
    if (got.timedOut && !c.pass) c.got += "\n（程式 20 秒內沒有結束）";
    return { i, t, ...c, hidden: !onlyExample && i > 0 };
  });
  const passed = rows.filter(r => r.pass).length;
  const score = Math.round(q.points * passed / rows.length * 10) / 10;
  return { rows, passed, total:rows.length, score };
}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmtIn = (o) => Object.entries(o).map(([k, v]) => `${k}=${v}`).join(", ") || "—";
function showResult(res, isSubmit) {
  const q = questions[current];
  const head = { "說出":["應該說出", "你說出"], "畫筆":["目標", "你畫的"], "角色位置":["應該停在", "你的角色"], "音符":["應該演奏", "你演奏"] }[q.mode];
  let html = `<table><tr><th>#</th><th>輸入</th><th>${head[0]}</th><th>${head[1]}</th><th></th></tr>`;
  for (const r of res.rows) {
    const hide = r.hidden;
    html += `<tr><td>${r.i + 1}</td><td>${hide ? "（隱藏）" : esc(fmtIn(r.t.in))}</td>
      <td>${hide ? "（隱藏）" : r.err ? "" : `<pre>${esc(r.exp)}</pre>`}</td>
      <td>${r.err ? `<span class="fail">${esc(r.err)}</span>` : hide ? "" : `<pre>${esc(r.got)}</pre>`}</td>
      <td class="${r.pass ? "pass" : "fail"}">${r.pass ? "✔" : "✘"}</td></tr>`;
  }
  html += `</table>`;
  if (isSubmit) html = `<p><b>通過 ${res.passed}/${res.total} 筆測資，本題得分 ${res.score} / ${q.points}</b></p>` + html;
  $("result").innerHTML = html;
}

// 畫筆題在題目卡上附一張目標圖形（座標格線上畫出範例測資的標準答案），學生照圖寫程式

  g.beginPath(); e.pen.forEach(([x1, y1, x2, y2]) => { g.moveTo(240 + x1, 180 - y1); g.lineTo(240 + x2 + (x1 === x2 && y1 === y2 ? 0.01 : 0), 180 - y2); }); g.stroke();
}

function exampleText(q) {
  const t = q.tests[0], e = expectedFor(q, 0);

  if (q.mode === "角色位置") return ins + `讓角色最後停在：${fmtPos(e.pos)}（角色從 x=0, y=0、面朝 90 度開始）`;
  if (q.mode === "音符") return ins + `依序演奏：${fmtNotes(e.notes)}`;
  return ins + `應該說出：\n${e.out.join("\n")}`;
}

// 國中班級是 7～9 年級三位數（例如 701）；常見的誤填是用一～三年級寫成 101～301。座號一律兩位數（01～99）
function classError(cls) {
  if (!cls) return "請填寫班級。";
  if (/^[789](0[1-9]|[1-9]\d)$/.test(cls)) return "";
  if (/^[123](0[1-9]|[1-9]\d)$/.test(cls)) return `班級輸入錯誤：「${cls}」要輸入 ${Number(cls[0]) + 6}${cls.slice(1)}。`;
  return `班級輸入錯誤：「${cls}」不是國中班級，請輸入三位數，例如 701、805、912。`;
}
function seatError(seat) {
  if (!seat) return "請填寫座號。";
  if (/^\d\d$/.test(seat) && seat !== "00") return "";
  if (/^[1-9]$/.test(seat)) return `座號輸入錯誤：座號要兩位數，「${seat}」要輸入 0${seat}。`;
  return `座號輸入錯誤：「${seat}」不對，請輸入兩位數字，例如 01、15。`;
}
function studentErrors() {
  const errs = [
    ["studentClass", classError($("studentClass").value.trim())],
    ["studentSeat", seatError($("studentSeat").value.trim())],
    ["studentName", $("studentName").value.trim() ? "" : "請填寫姓名。"],
  ].filter(e => e[1]);
  studentFields.forEach(f => $(f).classList.toggle("missing", errs.some(e => e[0] === f)));
  return errs;
}
// 填完班級或座號、離開欄位時就先檢查，不用等到交卷
["studentClass", "studentSeat"].forEach(f => $(f).addEventListener("change", () => {
  const err = (f === "studentClass" ? classError : seatError)($(f).value.trim());
  $(f).classList.toggle("missing", !!err);
  headMsg(err);
}));

// 提交本題、交卷前都要先填對班級、座號、姓名（截圖檔名要用）
function studentInfoOrStop(action) {
  const errs = studentErrors();
  if (errs.length) {
    headMsg(errs.map(e => e[1]).join(" ") + ` 改正後才能${action}。`);
    $(errs[0][0]).focus();
    return null;
  }
  headMsg("");
  return { cls:$("studentClass").value.trim(), seat:$("studentSeat").value.trim(), name:$("studentName").value.trim() };
}

$("btnSubmitAll").onclick = async () => {
  const who = studentInfoOrStop("交卷");
  if (!who) return;
  const { cls, seat, name } = who;

  saved[loadedId] = Blockly.serialization.workspaces.save(ws);
  const keep = current;
  let total = 0, full = 0, rows = "", csv = [];
  const scoreMap = {}, sections = [];
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    current = i;
    loadedId = q.id;
    loadInto(ws, saved[q.id] || starterState());
    const res = gradeCurrent(false);
    scores[q.id] = res.score;
    scoreMap[q.title] = res.score;
    total += res.score; full += Number(q.points);
    rows += `<tr><td>${esc(q.title)}</td><td>${res.passed}/${res.total}</td><td>${res.score} / ${q.points}</td></tr>`;
    csv.push(res.score);

    sections.push({ title:q.title, score:`${res.score} / ${q.points} 分`, img });
  }
  switchTo(keep); // 此時工作區內容與最後一題的存檔相同，可安全切回
  total = Math.round(total * 10) / 10;
  const cell = (s) => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  $("rCsv").value = `班級,座號,姓名,${questions.map(q => cell(q.title)).join(",")},總分\n${cell(cls)},${seat},${cell(name)},${csv.join(",")},${total}`;
  $("rMsg").textContent = "";
  $("report").innerHTML =
    `<p>班級：<b>${esc(cls)}</b>　座號：<b>${esc(seat)}</b>　姓名：<b>${esc(name)}</b><br>交卷時間：${new Date().toLocaleString()}</p>
     <table><tr><th>題目</th><th>通過測資</th><th>得分</th></tr>${rows}
     <tr><th colspan="2">總分</th><th>${total} / ${full}</th></tr></table>`;
  $("reportDlg").showModal();
  $("rShot").textContent = "";
  await sendSubmission({ cls, seat, name, total, full, scores:scoreMap });
  // 交卷截圖：所有題目的程式畫面合成一張
  const sayShot = (text, ok) => { $("rShot").textContent = text; $("rShot").className = "msg " + (ok ? "ok" : "err"); };
  $("btnSubmitAll").disabled = true;
  try {
    sayShot("答題截圖上傳中…", true);
    sayShot(await uploadShot(who, composeShot(who, `交卷　總分 ${total} / ${full} 分`, sections)), true);
  } catch (e) { sayShot(e.message, false); }
  finally { $("btnSubmitAll").disabled = false; }
};

// 把成績送到 Google 試算表的「成績」工作表（每交一次新增一列）
async function sendSubmission(record) {
  const say = (text, ok) => { $("rSend").textContent = text; $("rSend").className = "msg " + (ok ? "ok" : "err"); };
  if (!SCRIPT_URL) return say("還沒設定成績網址，成績沒有送出，請把下方 CSV 交給老師。", false);
  say("成績傳送中…", true);
  $("btnSubmitAll").disabled = true;
  try {
    // 用 text/plain 送出，Google Apps Script 才收得到（不會被瀏覽器的跨網域檢查擋下）
    const res = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(record) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "unknown");
    say("✔ 成績已送給老師。", true);
  } catch (e) {
    say("成績沒有送出：請確認網路連線後再按一次「交卷」，或把下方 CSV 交給老師。", false);
  } finally {
    $("btnSubmitAll").disabled = false;
  }
}

// ===== 答題截圖：把程式區的積木轉成圖片，上傳到老師的雲端硬碟 =====
// Blockly 的積木是 SVG：複製一份、加上 Blockly 的樣式，畫到 canvas 上變成 PNG
async function workspaceImage() {
  if (Blockly.renderManagement && Blockly.renderManagement.finishQueuedRenders) await Blockly.renderManagement.finishQueuedRenders();
  if (!ws.getTopBlocks(false).length) return null;
  const canvas = ws.getCanvas(), box = canvas.getBBox();
  if (!box.width || !box.height) return null;
  const pad = 16, w = Math.ceil(box.width + pad * 2), h = Math.ceil(box.height + pad * 2);
  const clone = canvas.cloneNode(true);
  clone.removeAttribute("transform");
  const css = [...document.querySelectorAll("style")].map(st => st.textContent).filter(t => t.includes("blockly")).join("\n");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="${ws.getParentSvg().getAttribute("class")}" width="${w}" height="${h}" viewBox="${box.x - pad} ${box.y - pad} ${w} ${h}">`
    + `<style><![CDATA[${css}]]></style><rect x="${box.x - pad}" y="${box.y - pad}" width="${w}" height="${h}" fill="#f9f9f9"/>`
    + `<g class="blocklyWorkspace">${new XMLSerializer().serializeToString(clone)}</g></svg>`;
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  await img.decode();
  return img;
}

// 合成截圖：上方寫班級、座號、姓名、時間，下面依序放每一題的程式畫面
function composeShot(who, heading, sections) {
  const font = '"Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif';
  const maxW = 1600, maxH = 2400;
  const fit = (img) => img ? Math.min(1, (maxW - 40) / img.width, maxH / img.height) : 1;
  const W = Math.max(640, Math.min(maxW, Math.max(0, ...sections.map(s => s.img ? s.img.width * fit(s.img) + 40 : 0))));
  const H = 96 + sections.reduce((sum, s) => sum + 44 + (s.img ? s.img.height * fit(s.img) : 40) + 16, 0);
  const c = mkCanvas(Math.ceil(W), Math.ceil(H)), g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#4c97ff"; g.fillRect(0, 0, c.width, 84);
  g.fillStyle = "#ffffff"; g.font = `bold 22px ${font}`;
  g.fillText(`班級 ${who.cls}　座號 ${who.seat}　姓名 ${who.name}`, 20, 36);
  g.font = `16px ${font}`;
  g.fillText(`${heading}　　${new Date().toLocaleString()}`, 20, 66);
  let y = 96;
  for (const s of sections) {
    g.fillStyle = "#3d4254"; g.font = `bold 18px ${font}`;
    g.fillText(`${s.title}　（${s.score}）`, 20, y + 28);
    y += 44;
    if (s.img) {
      const k = fit(s.img);
      g.drawImage(s.img, 20, y, s.img.width * k, s.img.height * k);
      g.strokeStyle = "#d9e0ec"; g.strokeRect(20, y, s.img.width * k, s.img.height * k);
      y += s.img.height * k;
    } else {
      g.fillStyle = "#8a90a3"; g.font = `16px ${font}`; g.fillText("（程式區沒有積木）", 20, y + 24);
      y += 40;
    }
    y += 16;
  }
  return c.toDataURL("image/png").split(",")[1];
}

async function uploadShot(who, png) {
  if (!SCRIPT_URL) throw new Error("還沒設定網址，答題截圖沒有上傳。");
  let data;
  try {
    const res = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({ type:"screenshot", cls:who.cls, seat:who.seat, name:who.name, image:png }) });
    data = await res.json();
  } catch (e) { throw new Error("答題截圖沒有上傳成功，請確認網路連線後再試一次。"); }
  if (!data.ok) throw new Error("答題截圖沒有上傳成功：" + (data.error || "請告訴老師"));
  return `✔ 答題截圖已上傳（${data.file}）。`;
}
$("rCopy").onclick = () => copyText($("rCsv").value, $("rCsv"), $("rMsg"), "已複製，可貼到 Excel");
$("rClose").onclick = () => $("reportDlg").close();

// ===== 12. 老師工具：網址加上 #teacher，可以把參考答案轉成答案碼 =====
function teacherMode() { $("btnAnswerCode").hidden = location.hash !== "#teacher"; }
window.addEventListener("hashchange", teacherMode);
teacherMode();
const codeMsg = (t, ok) => { $("codeMsg").textContent = t; $("codeMsg").className = "msg " + (ok ? "ok" : "err"); };
$("btnAnswerCode").onclick = () => {
  const state = Blockly.serialization.workspaces.save(ws);
  $("codeText").value = encodeAnswer(state);
  try { const p = compile(ws); codeMsg(p.hasFlag ? "已產生。答案碼包含目前程式區的所有積木。" : "注意：程式區沒有「當綠旗被點擊」，評分時不會執行。", p.hasFlag); }
  catch (e) { codeMsg("程式有錯誤：" + e.message, false); }
  $("codeDlg").showModal();
};
$("codeCopy").onclick = () => copyText($("codeText").value, $("codeText"), $("codeMsg"), "已複製，貼到試算表的「答案碼」欄。");
$("codeLoad").onclick = () => {
  try { loadInto(ws, decodeAnswer($("codeText").value)); codeMsg("已載入到程式區。", true); }
  catch (e) { codeMsg("答案碼無法讀取：" + e.message, false); }
};
$("codeClose").onclick = () => $("codeDlg").close();

// ===== 13. 啟動：讀取試算表的題庫 =====
async function loadBank() {
  if (!SCRIPT_URL) { bankState = "nourl"; renderPanel(); return; }
  try {
    const data = await (await fetch(SCRIPT_URL)).json();
    if (data.error) throw new Error(data.error);
    bankProblems = data.problems || [];
    if (bankProblems.length) console.warn("題庫格式問題：", bankProblems);
    questions = (data.questions || []).map(q => Object.assign({ mode:"說出", answer:"" }, q, {
      id:q.title,
      mode: MODES.includes(q.mode) ? q.mode : "說出",
      tests: q.tests.map(t => ({ in:t.in || {}, expect: t.expect !== undefined ? t.expect : Array.isArray(t.out) ? t.out.join("|") : null })),
    }));
    bankState = "ready";
    if (questions.length) switchTo(0); else renderPanel();
  } catch (e) {
    console.error(e);
    bankState = "error";
    renderPanel();
  }
}
loadInto(ws, starterState());
renderPanel();
ws.getToolbox().selectItemByPosition(0); // 跟 Scratch 一樣，一打開就顯示第一個分類的積木盤
loadBank();
</script>
